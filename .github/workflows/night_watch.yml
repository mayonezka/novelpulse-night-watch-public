name: NovelPulse Night-Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
permissions:
  contents: write
  actions: write
jobs:
  cashier:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: novelpulse-cashier
      cancel-in-progress: false
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      CLOUD_STATE_KEY: ${{ secrets.CLOUD_STATE_KEY }}
      CLOUD_REPO: ${{ github.repository }}
      CLOUD_ROLE: cloud
      NODE_MODE: bot_24x7
      CLOUD_FAILOVER_ENABLED: 'true'
      GITHUB_TOKEN: ${{ github.token }}
      CLOUD_MAX_SECONDS: '19200'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cloud.txt
      - run: python scripts/run_cloud_night_watch.py
      - name: Always queue warm successor
        if: always()
        run: python scripts/relay_night_watch.py
